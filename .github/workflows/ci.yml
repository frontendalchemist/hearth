name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  secrets-scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest
    needs: secrets-scan

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

      # E2E tests are skipped until Playwright config and tests are written
      # - name: Install Playwright browsers
      #   run: pnpm --filter @hearth/web exec playwright install --with-deps chromium
      # - name: E2E tests
      #   run: pnpm test:e2e
      #   env:
      #     E2E_BASE_URL: ${{ secrets.NETLIFY_PREVIEW_URL || 'http://localhost:3000' }}

  chromatic:
    name: Chromatic visual regression
    runs-on: ubuntu-latest
    needs: secrets-scan
    # Skipped automatically when CHROMATIC_PROJECT_TOKEN is unset (e.g. on forks),
    # so the job won't break PRs from contributors who don't have the secret.
    if: ${{ vars.CHROMATIC_ENABLED == 'true' || github.repository_owner == 'PlinytheYounger' }}

    steps:
      - uses: actions/checkout@v5
        with:
          # Chromatic needs full git history to diff against the baseline.
          fetch-depth: 0

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: apps/web
          buildScriptName: build-storybook
          exitZeroOnChanges: true
          onlyChanged: true

  integration:
    name: Integration tests (real DB)
    runs-on: ubuntu-latest
    needs: secrets-scan
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run integration tests
        run: pnpm test:integration
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}

      - name: Clean up leaked Neon branch (safety net)
        if: always()
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          F=apps/web/node_modules/.cache/neon-test-branch.json
          [ -f "$F" ] || exit 0
          BRANCH_ID=$(jq -r .branchId "$F")
          curl -fsS -X DELETE -H "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$BRANCH_ID" || true
