name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

jobs:
  secrets-scan:
    name: Scan for secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest
    needs: secrets-scan

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Verify packages/shared/schema.graphql is in sync
        run: |
          pnpm graphql:codegen
          if ! git diff --quiet packages/shared/schema.graphql; then
            echo "::error::packages/shared/schema.graphql is stale."
            echo "Run 'pnpm graphql:codegen' locally and commit the result."
            git --no-pager diff packages/shared/schema.graphql
            exit 1
          fi

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test:unit

  e2e:
    name: E2E (Playwright smoke)
    runs-on: ubuntu-latest
    needs: secrets-scan
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('apps/web/package.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: pnpm --filter @hearth/web exec playwright install --with-deps chromium

      - name: Run smoke tests
        run: pnpm test:e2e
        env:
          # When NETLIFY_PREVIEW_URL is set we hit the deployed preview;
          # otherwise the playwright config boots `pnpm dev` locally.
          E2E_BASE_URL: ${{ secrets.NETLIFY_PREVIEW_URL || '' }}
          # The smoke path renders /login without touching the DB or making
          # real Auth0 calls, but the Auth0Client + Prisma client both want
          # env vars at import time. These placeholders satisfy that without
          # contacting any external system.
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
          APP_BASE_URL: http://localhost:3000
          AUTH0_DOMAIN: example.auth0.com
          AUTH0_CLIENT_ID: ci-placeholder-client-id
          AUTH0_CLIENT_SECRET: ci-placeholder-client-secret
          AUTH0_SECRET: ci-placeholder-secret-value-must-be-32-chars-or-more
          UPSTASH_REDIS_REST_URL: https://example.upstash.io
          UPSTASH_REDIS_REST_TOKEN: ci-placeholder-token

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse (perf baseline)
    runs-on: ubuntu-latest
    needs: secrets-scan
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Build app
        env:
          # Same placeholder env strategy as the e2e job — the build must
          # succeed but never contacts a real backend. The audited path
          # (/login) doesn't make Auth0 / Prisma / Redis calls at runtime.
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
          APP_BASE_URL: http://localhost:3001
          AUTH0_DOMAIN: example.auth0.com
          AUTH0_CLIENT_ID: ci-placeholder-client-id
          AUTH0_CLIENT_SECRET: ci-placeholder-client-secret
          AUTH0_SECRET: ci-placeholder-secret-value-must-be-32-chars-or-more
          UPSTASH_REDIS_REST_URL: https://example.upstash.io
          UPSTASH_REDIS_REST_TOKEN: ci-placeholder-token
        run: pnpm --filter @hearth/web build

      - name: Run Lighthouse CI
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
          APP_BASE_URL: http://localhost:3001
          AUTH0_DOMAIN: example.auth0.com
          AUTH0_CLIENT_ID: ci-placeholder-client-id
          AUTH0_CLIENT_SECRET: ci-placeholder-client-secret
          AUTH0_SECRET: ci-placeholder-secret-value-must-be-32-chars-or-more
          UPSTASH_REDIS_REST_URL: https://example.upstash.io
          UPSTASH_REDIS_REST_TOKEN: ci-placeholder-token
        run: pnpm lighthouse

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: apps/web/.lighthouseci
          retention-days: 14

  chromatic:
    name: Chromatic visual regression
    runs-on: ubuntu-latest
    needs: secrets-scan
    # Skipped automatically when CHROMATIC_PROJECT_TOKEN is unset (e.g. on forks),
    # so the job won't break PRs from contributors who don't have the secret.
    if: ${{ vars.CHROMATIC_ENABLED == 'true' || github.repository_owner == 'PlinytheYounger' }}

    steps:
      - uses: actions/checkout@v6
        with:
          # Chromatic needs full git history to diff against the baseline.
          fetch-depth: 0

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: apps/web
          buildScriptName: build-storybook
          exitZeroOnChanges: true
          onlyChanged: true

  integration:
    name: Integration tests (real DB)
    runs-on: ubuntu-latest
    needs: secrets-scan
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run integration tests
        run: pnpm test:integration
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}

      - name: Clean up leaked Neon branch (safety net)
        if: always()
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
        run: |
          F=apps/web/node_modules/.cache/neon-test-branch.json
          [ -f "$F" ] || exit 0
          BRANCH_ID=$(jq -r .branchId "$F")
          curl -fsS -X DELETE -H "Authorization: Bearer $NEON_API_KEY" \
            "https://console.neon.tech/api/v2/projects/$NEON_PROJECT_ID/branches/$BRANCH_ID" || true
