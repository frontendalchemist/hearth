<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aging Gracefully — Platform Wireframes</title>
<template id="__bundler_thumbnail" data-bg-color="#faf7f2">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#faf7f2"/>
    <rect width="1200" height="56" fill="#ffffff"/>
    <rect x="20" y="18" width="160" height="20" rx="4" fill="#4a7050"/>

    <rect x="20" y="92" width="120" height="16" rx="3" fill="#4a7050"/>

    <rect x="244" y="130" width="700" height="80" rx="6" fill="#ffffff" stroke="#c4bcb4" stroke-width="1.5"/>
    <rect x="244" y="228" width="700" height="60" rx="6" fill="#ffffff" stroke="#c4bcb4" stroke-width="1.5"/>
    <rect x="244" y="306" width="700" height="60" rx="6" fill="#ffffff" stroke="#c4bcb4" stroke-width="1.5"/>
    <rect x="244" y="400" width="160" height="100" rx="6" fill="#ffffff" stroke="#c4bcb4" stroke-width="1.5"/>
    <rect x="420" y="400" width="160" height="100" rx="6" fill="#ffffff" stroke="#c4bcb4" stroke-width="1.5"/>
    <rect x="596" y="400" width="160" height="100" rx="6" fill="#ffffff" stroke="#c4bcb4" stroke-width="1.5"/>
    <rect x="772" y="400" width="160" height="100" rx="6" fill="#ffffff" stroke="#c4bcb4" stroke-width="1.5"/>
    <rect x="254" y="412" width="36" height="36" rx="8" fill="#ddeadf"/>
    <rect x="430" y="412" width="36" height="36" rx="8" fill="#dce8f0"/>
    <rect x="606" y="412" width="36" height="36" rx="8" fill="#f2e0d6"/>
    <rect x="782" y="412" width="36" height="36" rx="8" fill="#fdefd7"/>
  </svg>
</template>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #faf7f2; font-family: 'Inter', sans-serif; color: #2d2926; height: 100vh; overflow: hidden; }
  .sketch { font-family: 'DM Serif Display', serif; }
  ::-webkit-scrollbar { width: 6px; } 
  ::-webkit-scrollbar-thumb { background: #d4ccc4; border-radius: 3px; }

  /* Skip link */
  .skip-link { position: absolute; top: -100px; left: 16px; background: #6b8f71; color: #fff; padding: 10px 16px; border-radius: 0 0 8px 8px; font-size: 14px; font-weight: 600; z-index: 9999; text-decoration: none; transition: top 0.15s; }
  .skip-link:focus { top: 0; outline: 3px solid #2d2926; outline-offset: 2px; }

  /* Focus rings — visible for keyboard nav */
  :focus-visible { outline: 3px solid #6b8f71; outline-offset: 2px; border-radius: 4px; }
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 3px solid #6b8f71; outline-offset: 2px; }

  /* Placeholder box with diagonal lines */
  .ph { background: repeating-linear-gradient(45deg, #e8e2da 0px, #e8e2da 1px, #f0ebe3 1px, #f0ebe3 8px); border: 1.5px dashed #c4bcb4; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-family: 'DM Serif Display', serif; color: #6b605a; font-size: 13px; text-align: center; }
  
  /* Wireframe box */
  .wbox { border: 1.5px solid #c4bcb4; border-radius: 6px; background: #fff; }
  .wbox-dashed { border: 1.5px dashed #c4bcb4; border-radius: 6px; background: #faf7f2; }

  /* Tags — all meet 4.5:1 contrast on their bg */
  .tag { display: inline-block; padding: 3px 9px; border-radius: 12px; font-size: 11px; font-family: 'Inter', sans-serif; font-weight: 600; letter-spacing: 0.01em; }
  .tag-sage { background: #c8deca; color: #24532c; }
  .tag-coral { background: #f2d0c4; color: #7a2c0e; }
  .tag-amber { background: #fde5b8; color: #6b3d00; }
  .tag-gray { background: #ddd8d2; color: #3a322c; }
  .tag-blue { background: #c4d8e8; color: #14405e; }

  /* Buttons — min 44px touch target height */
  .btn { min-height: 44px; padding: 8px 18px; border-radius: 6px; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; border: 1.5px solid #c4bcb4; background: #fff; color: #2d2926; transition: all 0.15s; }
  .btn:hover { background: #f0ebe3; }
  .btn-primary { background: #4a7050; border-color: #4a7050; color: #fff; }
  .btn-primary:hover { background: #3a5a40; }
  .btn-coral { background: #9a4228; border-color: #9a4228; color: #fff; }
  .btn-coral:hover { background: #7a3218; }

  /* Tweaks panel */
  #tweaks-panel { position: fixed; bottom: 20px; right: 20px; background: #fff; border: 2px solid #c4bcb4; border-radius: 10px; padding: 16px; width: 240px; box-shadow: 0 4px 20px rgba(0,0,0,0.12); z-index: 1000; display: none; font-family: 'DM Serif Display', serif; }
  #tweaks-panel h3 { font-size: 15px; font-weight: 700; margin-bottom: 12px; color: #3a6040; font-family: 'Inter', sans-serif; }
  #tweaks-panel label { display: block; font-size: 13px; margin-bottom: 4px; color: #3a322c; font-family: 'Inter', sans-serif; }
  #tweaks-panel select, #tweaks-panel input { width: 100%; padding: 6px 8px; border: 1.5px solid #c4bcb4; border-radius: 4px; font-family: 'Inter', sans-serif; font-size: 13px; background: #faf7f2; margin-bottom: 10px; }
  #tweaks-panel select:focus-visible { outline: 3px solid #6b8f71; }

  /* Screen-reader only utility */
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

  .module-label { font-family: 'Inter', sans-serif; font-size: 11px; color: #7a7068; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; font-weight: 600; }
</style>
</head>
<body>
<a href="#main-content" class="skip-link">Skip to main content</a>
<div id="root"></div>

<div id="tweaks-panel">
  <h3>✏️ Tweaks</h3>
  <label>Navigation style</label>
  <select id="tweak-nav">
    <option value="sidebar">Sidebar (left panel)</option>
    <option value="topbar">Top tab bar</option>
  </select>
  <label>Dashboard layout</label>
  <select id="tweak-dash">
    <option value="cards">Module card grid</option>
    <option value="feed">Timeline / activity feed</option>
  </select>
  <label>AI Assistant position</label>
  <select id="tweak-ai">
    <option value="floating">Floating chat button</option>
    <option value="inline">Inline right panel</option>
  </select>
</div>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

// ─── Wireframe primitives ───────────────────────────────────────────────
const Ph = ({ h, label, className = '' }) => (
  <div className={`ph ${className}`} style={{ height: h, width: '100%' }}>{label}</div>
);

const Divider = () => <div style={{ borderTop: '1px solid #e8e2da', margin: '12px 0' }} />;

const Row = ({ children, gap = 8 }) => (
  <div style={{ display: 'flex', gap, alignItems: 'flex-start' }}>{children}</div>
);

const Col = ({ children, flex = 1, gap = 8 }) => (
  <div style={{ display: 'flex', flexDirection: 'column', flex, gap }}>{children}</div>
);

const Tag = ({ t, type = 'gray' }) => <span className={`tag tag-${type}`}>{t}</span>;

const SectionTitle = ({ children }) => (
  <div className="sketch" style={{ fontSize: 22, fontWeight: 700, color: '#2d2926', marginBottom: 4 }}>{children}</div>
);

const SubTitle = ({ children }) => (
  <div style={{ fontSize: 13, color: '#7a7068', marginBottom: 12, lineHeight: 1.4 }}>{children}</div>
);

const Card = ({ children, style = {} }) => (
  <div className="wbox" style={{ padding: 14, ...style }}>{children}</div>
);

const StatBox = ({ label, value, sub, color = '#6b8f71' }) => (
  <div className="wbox" style={{ padding: 12, flex: 1, textAlign: 'center' }}>
    <div className="sketch" style={{ fontSize: 28, fontWeight: 700, color }}>{value}</div>
    <div style={{ fontSize: 11, color: '#5a5048', fontWeight: 500 }}>{label}</div>
    {sub && <div style={{ fontSize: 10, color: '#9a8f87', marginTop: 2 }}>{sub}</div>}
  </div>
);

const ListItem = ({ icon, text, sub, badge }) => (
  <div style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '8px 0', borderBottom: '1px solid #f0ebe3' }}>
    <div style={{ width: 28, height: 28, borderRadius: 6, background: '#f0ebe3', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 14, flexShrink: 0 }}>{icon}</div>
    <div style={{ flex: 1, minWidth: 0 }}>
      <div style={{ fontSize: 13, fontWeight: 500, color: '#2d2926' }}>{text}</div>
      {sub && <div style={{ fontSize: 11, color: '#9a8f87' }}>{sub}</div>}
    </div>
    {badge && <Tag t={badge} type="coral" />}
  </div>
);

// ─── MODULE SCREENS ─────────────────────────────────────────────────────

const DashboardCards = ({ profile, setActiveModule }) => {
  const isParent = profile === 'parent';
  const name = isParent ? 'Dorothy' : "Mom (Dorothy)";

  const caregiverModules = [
    { icon: '🗂', label: 'Family Vault', desc: '14 docs · 2 expiring soon', accent: '#ddeadf', badge: '⚠️ 2', id: 'vault' },
    { icon: '💊', label: 'Health Hub', desc: '6 meds · 3 screenings due', accent: '#dce8f0', badge: '3 due', id: 'health' },
    { icon: '🏡', label: 'Care Finder', desc: 'Stage 2 · In-home care options', accent: '#f2e0d6', id: 'carefinder' },
    { icon: '💰', label: 'Money & Coverage', desc: 'Medicare Part B enrolled', accent: '#fdefd7', badge: 'OEP Nov', id: 'money' },
    { icon: '🗺', label: 'Stage Navigator', desc: 'Early Assistance · Stage 2 of 5', accent: '#e5ede6', id: 'navigator' },
    { icon: '🤝', label: 'Family Workspace', desc: '3 members · 4 open tasks', accent: '#fce8dc', id: 'workspace' },
  ];

  const parentModules = [
    { icon: '💊', label: 'Health Hub', desc: '6 meds · 3 screenings due', accent: '#dce8f0', badge: '3 due', id: 'health' },
    { icon: '📋', label: 'Plan for Yourself', desc: 'Advance directive 40% complete', accent: '#ece8f5', badge: '60% left', id: 'plan' },
  ];

  const modules = isParent ? parentModules : caregiverModules;

  const notifications = isParent ? [
    { icon: '💊', text: 'Lisinopril refill due in 5 days', action: 'Health Hub', level: 'amber', id: 'health' },
    { icon: '📋', text: 'Your advance directive is 40% complete', action: 'Continue', level: 'sage', id: 'plan' },
    { icon: '📅', text: 'Cardiology appointment Apr 24 at 10:30am', action: 'View', level: 'gray', id: 'health' },
  ] : [
    { icon: '⚠️', text: 'LTC insurance policy expires in 73 days', action: 'Review', level: 'coral', id: 'money' },
    { icon: '⚠️', text: 'Healthcare Proxy missing for Dorothy', action: 'Upload now', level: 'coral', id: 'vault' },
    { icon: '💊', text: 'Drug interaction flagged: Lisinopril + Amlodipine', action: 'View', level: 'amber', id: 'health' },
    { icon: '📅', text: 'Cardiology follow-up in 6 days (Apr 24)', action: 'Prepare', level: 'gray', id: 'health' },
    { icon: '✅', text: 'Mark completed: research in-home agencies', action: 'View task', level: 'sage', id: 'workspace' },
  ];

  return (
    <div>
      {/* Header */}
      <div style={{ marginBottom: 20 }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 2 }}>
          <SectionTitle>{isParent ? 'Good morning, Dorothy' : `Caring for ${name}`}</SectionTitle>
          {!isParent && <Tag t="Stage 2: Early Assistance" type="sage" />}
        </div>
        <SubTitle>{isParent ? 'Your health and aging plan, all in one place.' : 'Here\'s what needs your attention today.'}</SubTitle>
      </div>

      {/* Quick actions — TOP */}
      <div style={{ marginBottom: 20 }}>
        <div className="module-label">Quick actions</div>
        <Row gap={8}>
          {isParent ? <>
            <button className="btn btn-primary" style={{ fontSize: 13 }}>💊 View medications</button>
            <button className="btn" style={{ fontSize: 13 }}>📋 Continue my plan</button>
            <button className="btn" style={{ fontSize: 13 }}>💬 Ask AI Assistant</button>
          </> : <>
            <button className="btn btn-coral" style={{ fontSize: 13 }}>🚨 Emergency share packet</button>
            <button className="btn" style={{ fontSize: 13 }}>📤 Share care summary</button>
            <button className="btn" style={{ fontSize: 13 }}>📋 Family meeting agenda</button>
            <button className="btn" style={{ fontSize: 13 }}>💬 Ask AI Assistant</button>
          </>}
        </Row>
      </div>

      {/* Notifications */}
      <div style={{ marginBottom: 20 }}>
        <div className="module-label">Reminders & alerts</div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {notifications.map((n, i) => (
            <div key={i} style={{
              display: 'flex', alignItems: 'center', gap: 12, padding: '10px 14px',
              borderRadius: 8, background: '#fff', border: '1.5px solid',
              borderColor: n.level === 'coral' ? '#e8b4a0' : n.level === 'amber' ? '#e8d4a0' : n.level === 'sage' ? '#a8c8ae' : '#e8e2da',
            }}>
              <span style={{ fontSize: 16, flexShrink: 0 }}>{n.icon}</span>
              <div style={{ flex: 1, fontSize: 13, color: '#2d2926' }}>{n.text}</div>
              <button className="btn" style={{ fontSize: 12, padding: '4px 12px', flexShrink: 0 }}>{n.action} →</button>
            </div>
          ))}
        </div>
      </div>

      {/* Module shortcuts */}
      <div>
        <div className="module-label">{isParent ? 'Your tools' : 'Jump to module'}</div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(180px, 1fr))', gap: 10 }}>
          {modules.map(m => (
            <div key={m.label} className="wbox" style={{ padding: 14, cursor: 'pointer', transition: 'all 0.15s' }}
              onClick={() => setActiveModule(m.id)}
              onMouseEnter={e => e.currentTarget.style.transform = 'translateY(-2px)'}
              onMouseLeave={e => e.currentTarget.style.transform = ''}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 8 }}>
                <div style={{ width: 34, height: 34, borderRadius: 8, background: m.accent, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 17 }}>{m.icon}</div>
                {m.badge && <Tag t={m.badge} type="coral" />}
              </div>
              <div className="sketch" style={{ fontSize: 15, fontWeight: 700, marginBottom: 2 }}>{m.label}</div>
              <div style={{ fontSize: 11, color: '#7a7068' }}>{m.desc}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
};

const DashboardFeed = ({ profile }) => {
  const isParent = profile === 'parent';
  const items = [
    { date: 'Today', icon: '💊', text: 'Medication refill reminder', sub: 'Lisinopril — 5 days remaining', badge: 'Health Hub', badgeType: 'blue' },
    { date: 'Today', icon: '🗂', text: 'Will uploaded by Sarah', sub: 'Auto-categorized as Legal · tap to review', badge: 'Vault', badgeType: 'sage' },
    { date: 'Yesterday', icon: '✅', text: 'Task completed: Call cardiologist', sub: 'Completed by Mark Johnson', badge: 'Workspace', badgeType: 'gray' },
    { date: 'Apr 15', icon: '📋', text: 'Advance directive 40% complete', sub: 'Continue building your personal plan', badge: 'Plan for Yourself', badgeType: 'amber' },
    { date: 'Apr 12', icon: '🗺', text: 'Stage Navigator update', sub: 'New warning signs checklist available for Stage 2', badge: 'Navigator', badgeType: 'sage' },
    { date: 'Apr 10', icon: '🏡', text: '3 facilities saved to shortlist', sub: 'Sunrise Senior Living, Oak Park Memory Care +1', badge: 'Care Finder', badgeType: 'coral' },
  ];
  return (
    <div>
      <div style={{ marginBottom: 20 }}>
        <SectionTitle>{isParent ? 'My Dashboard' : "Mom's Care — Activity Feed"}</SectionTitle>
        <SubTitle>Everything happening across all modules, in one stream.</SubTitle>
      </div>
      <Row gap={16}>
        <Col flex={2}>
          <div className="module-label">Recent activity</div>
          {items.map((it, i) => (
            <div key={i} className="wbox" style={{ padding: 12, marginBottom: 8 }}>
              <div style={{ display: 'flex', gap: 10, alignItems: 'flex-start' }}>
                <div style={{ width: 32, height: 32, borderRadius: 8, background: '#f0ebe3', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 16, flexShrink: 0 }}>{it.icon}</div>
                <div style={{ flex: 1 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <div style={{ fontSize: 13, fontWeight: 500 }}>{it.text}</div>
                    <Tag t={it.badge} type={it.badgeType} />
                  </div>
                  <div style={{ fontSize: 11, color: '#9a8f87' }}>{it.sub}</div>
                </div>
              </div>
            </div>
          ))}
        </Col>
        <Col flex={1}>
          <div className="module-label">Upcoming</div>
          <Card>
            <ListItem icon="🩺" text="Cardiology follow-up" sub="Apr 24" badge="3 days" />
            <ListItem icon="💊" text="Rx refill: Lisinopril" sub="Apr 23" />
            <ListItem icon="📅" text="Medicare OEP" sub="Nov 15 deadline" />
          </Card>
          <div style={{ marginTop: 12 }}>
            <div className="module-label">Stage at a glance</div>
            <Card>
              <div className="sketch" style={{ fontSize: 16, fontWeight: 700, marginBottom: 6 }}>Stage 2: Early Assistance</div>
              <div style={{ display: 'flex', gap: 4, marginBottom: 8 }}>
                {[1,2,3,4,5].map(s => (
                  <div key={s} style={{ flex: 1, height: 6, borderRadius: 3, background: s <= 2 ? '#6b8f71' : '#e8e2da' }} />
                ))}
              </div>
              <div style={{ fontSize: 12, color: '#7a7068' }}>Needs help with finances, cooking, medications. Watch for falls, missed appointments.</div>
            </Card>
          </div>
          <div style={{ marginTop: 12 }}>
            <button className="btn btn-coral" style={{ width: '100%', fontSize: 14 }}>🚨 Emergency share packet</button>
          </div>
        </Col>
      </Row>
    </div>
  );
};

const FamilyVaultScreen = () => (
  <div>
    <SectionTitle>🗂 Family Vault</SectionTitle>
    <SubTitle>Secure, organized, instantly accessible when it matters most.</SubTitle>

    <Row gap={8} style={{ marginBottom: 16 }}>
      <StatBox label="Documents" value="14" color="#6b8f71" />
      <StatBox label="Categories" value="6" color="#6b8f71" />
      <StatBox label="Expiring soon" value="2" color="#c17c5a" sub="within 30 days" />
      <StatBox label="Checklist" value="68%" color="#4a7050" sub="complete" />
    </Row>

    {/* Document checklist alert */}
    <div style={{ background: '#f2e0d6', border: '1px solid #d4987a', borderRadius: 8, padding: 12, marginBottom: 16 }}>
      <div className="sketch" style={{ fontSize: 15, fontWeight: 600, marginBottom: 4 }}>⚠️ Missing: Healthcare Proxy for Dorothy</div>
      <div style={{ fontSize: 12, color: '#7a4028' }}>This is a critical document. Add it now or invite Dorothy to upload it.</div>
      <div style={{ marginTop: 8, display: 'flex', gap: 8 }}>
        <button className="btn btn-coral" style={{ fontSize: 12 }}>Upload now</button>
        <button className="btn" style={{ fontSize: 12 }}>Remind Dorothy</button>
      </div>
    </div>

    <Row gap={16}>
      <Col flex={1}>
        <div className="module-label">Document categories</div>
        {[
          { label: '⚖️ Legal', count: 3, docs: ['Will (2023)', 'Financial POA', 'Living Will'], status: 'warning' },
          { label: '🏥 Medical', count: 4, docs: ['Insurance card', 'Medication list', 'Allergy list', 'Surgical records'], status: 'ok' },
          { label: '💰 Financial', count: 2, docs: ['Bank accounts', 'Investment summary'], status: 'ok' },
          { label: '🪪 Identity', count: 3, docs: ['Passport', 'SSN card', 'Birth certificate'], status: 'ok' },
          { label: '🛡 Insurance', count: 2, docs: ['Medicare', 'LTC insurance ⚠️'], status: 'warning' },
          { label: '📋 Care Plans', count: 0, docs: [], status: 'missing' },
        ].map(cat => (
          <div key={cat.label} className="wbox" style={{ padding: 12, marginBottom: 8, borderLeft: `3px solid ${cat.status === 'ok' ? '#6b8f71' : cat.status === 'warning' ? '#e5a84a' : '#c17c5a'}` }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 4 }}>
              <div className="sketch" style={{ fontSize: 16, fontWeight: 700 }}>{cat.label}</div>
              <Tag t={cat.status === 'missing' ? '+ Add' : `${cat.count} docs`} type={cat.status === 'missing' ? 'coral' : 'gray'} />
            </div>
            <div style={{ fontSize: 11, color: '#7a7068' }}>{cat.docs.length ? cat.docs.join(' · ') : 'No documents yet'}</div>
          </div>
        ))}
      </Col>

      <Col flex={1}>
        <div style={{ display: 'flex', gap: 8, marginBottom: 8 }}>
          <div className="wbox-dashed" style={{ flex: 1, padding: 14, textAlign: 'center', cursor: 'pointer' }}>
            <div style={{ fontSize: 24, marginBottom: 4 }}>⬆️</div>
            <div className="sketch" style={{ fontSize: 14 }}>Upload document</div>
            <div style={{ fontSize: 11, color: '#9a8f87' }}>Auto-categorized by AI</div>
          </div>

// ─── MAIN APP ────────────────────────────────────────────────────────────

const ALL_MODULES = [
  { id: 'dashboard', icon: '🏠', label: 'Dashboard' },
  { id: 'vault', icon: '🗂', label: 'Family Vault' },
  { id: 'health', icon: '💊', label: 'Health Hub' },
  { id: 'carefinder', icon: '🏡', label: 'Care Finder' },
  { id: 'money', icon: '💰', label: 'Money & Coverage' },
  { id: 'plan', icon: '📋', label: 'Plan for Yourself' },
  { id: 'navigator', icon: '🗺', label: 'Stage Navigator' },
  { id: 'workspace', icon: '🤝', label: 'Family Workspace' },
  { id: 'ai', icon: '✨', label: 'AI Assistant' },
];

const PARENT_MODULES = ['dashboard', 'health', 'plan', 'ai'];

function App() {
  const [activeModule, setActiveModule] = useState('dashboard');
  const [profile, setProfile] = useState('caregiver'); // 'caregiver' | 'parent'
  const [navStyle, setNavStyle] = useState('sidebar');
  const [dashStyle, setDashStyle] = useState('cards');
  const [aiMode, setAiMode] = useState('floating');
  const [showAIChat, setShowAIChat] = useState(false);
  const [showTweaks, setShowTweaks] = useState(false);

  // Tweaks panel integration
  useEffect(() => {
    const listener = (e) => {
      if (e.data?.type === '__activate_edit_mode') setShowTweaks(true);
      if (e.data?.type === '__deactivate_edit_mode') setShowTweaks(false);
    };
    window.addEventListener('message', listener);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', listener);
  }, []);

  // Sync tweaks panel changes
  useEffect(() => {
    const navEl = document.getElementById('tweak-nav');
    const dashEl = document.getElementById('tweak-dash');
    const aiEl = document.getElementById('tweak-ai');
    if (navEl) navEl.onchange = (e) => setNavStyle(e.target.value);
    if (dashEl) dashEl.onchange = (e) => setDashStyle(e.target.value);
    if (aiEl) aiEl.onchange = (e) => setAiMode(e.target.value);
  });

  useEffect(() => {
    const panel = document.getElementById('tweaks-panel');
    if (panel) panel.style.display = showTweaks ? 'block' : 'none';
  }, [showTweaks]);

  const MODULES = ALL_MODULES.filter(m => profile === 'parent' ? PARENT_MODULES.includes(m.id) : true);

  // If current module isn't available for this profile, reset to dashboard
  useEffect(() => {
    if (profile === 'parent' && !PARENT_MODULES.includes(activeModule)) {
      setActiveModule('dashboard');
    }
  }, [profile]);

  const renderScreen = () => {
    switch (activeModule) {
      case 'dashboard': return dashStyle === 'cards'
        ? <DashboardCards profile={profile} setActiveModule={setActiveModule} />
        : <DashboardFeed profile={profile} />;
      case 'vault': return <FamilyVaultScreen />;
      case 'health': return <HealthHubScreen />;
      case 'navigator': return <StageNavigatorScreen />;
      case 'carefinder': return <CareFinder />;
      case 'money': return <MoneyScreen />;
      case 'plan': return <PlanForYourselfScreen />;
      case 'workspace': return <WorkspaceScreen />;
      case 'ai': return <AIAssistantScreen aiMode={aiMode} />;
      default: return <DashboardCards profile={profile} />;
    }
  };

  const ProfileSwitcher = () => (
    <div style={{ display: 'flex', alignItems: 'center', gap: 4, background: '#f0ebe3', borderRadius: 20, padding: '4px 6px' }}>
      {[
        { id: 'caregiver', label: '👩 Sarah', sub: 'Caregiver' },
        { id: 'parent', label: '👵 Dorothy', sub: 'Her mom' },
      ].map(p => (
        <button key={p.id} onClick={() => setProfile(p.id)} style={{
          padding: '4px 12px', borderRadius: 16, border: 'none', cursor: 'pointer',
          background: profile === p.id ? '#fff' : 'transparent',
          color: profile === p.id ? '#2d2926' : '#7a7068',
          fontFamily: 'DM Serif Display, serif', fontSize: 14, fontWeight: profile === p.id ? 700 : 400,
          boxShadow: profile === p.id ? '0 1px 4px rgba(0,0,0,0.1)' : 'none',
          transition: 'all 0.15s',
        }}>{p.label}</button>
      ))}
    </div>
  );

  // ── TOP BAR ──
  const TopBar = () => (
    <div style={{ height: 56, background: '#fff', borderBottom: '1px solid #e8e2da', display: 'flex', alignItems: 'center', padding: '0 20px', gap: 16, flexShrink: 0, zIndex: 10 }}>
      <div className="sketch" style={{ fontSize: 20, fontWeight: 700, color: '#6b8f71', letterSpacing: '-0.5px' }}>Aging Gracefully</div>
      {navStyle === 'topbar' && (
        <div style={{ display: 'flex', gap: 2, overflowX: 'auto', flex: 1 }}>
          {MODULES.map(m => (
            <button key={m.id} onClick={() => setActiveModule(m.id)} style={{
              padding: '6px 12px', border: 'none', borderRadius: 6, cursor: 'pointer',
              background: activeModule === m.id ? '#eef4ef' : 'transparent',
              color: activeModule === m.id ? '#4a7050' : '#5a5048',
              fontFamily: 'DM Serif Display, serif', fontSize: 14, fontWeight: activeModule === m.id ? 700 : 400,
              whiteSpace: 'nowrap', transition: 'all 0.15s',
            }}>{m.icon} {m.label}</button>
          ))}
        </div>
      )}
      <div style={{ flex: 1 }} />
      <ProfileSwitcher />
    </div>
  );

  return (
    <div style={{ display: 'flex', flexDirection: 'column', height: '100vh' }}>
      <TopBar />
      <div style={{ display: 'flex', flex: 1, overflow: 'hidden' }}>
        {/* Sidebar nav */}
        {navStyle === 'sidebar' && (
          <nav aria-label="Main navigation" style={{ width: 220, background: '#f5f0ea', borderRight: '1px solid #e8e2da', display: 'flex', flexDirection: 'column', padding: '12px 0', overflowY: 'auto', flexShrink: 0 }}>
            {MODULES.map(m => (
              <button
                key={m.id}
                onClick={() => setActiveModule(m.id)}
                aria-current={activeModule === m.id ? 'page' : undefined}
                aria-label={m.label}
                style={{
                  display: 'flex', alignItems: 'center', gap: 10, padding: '9px 16px',
                  border: 'none', background: activeModule === m.id ? '#deeadf' : 'transparent',
                  borderLeft: activeModule === m.id ? '4px solid #4a7050' : '4px solid transparent',
                  cursor: 'pointer', textAlign: 'left', width: '100%', minHeight: 44,
                  color: activeModule === m.id ? '#24532c' : '#3a322c',
                  transition: 'all 0.12s',
                }}>
                <span aria-hidden="true" style={{ fontSize: 16, flexShrink: 0 }}>{m.icon}</span>
                <span className="sketch" style={{ fontSize: 14, fontWeight: activeModule === m.id ? 700 : 400, whiteSpace: 'nowrap' }}>{m.label}</span>
              </button>
            ))}
          </nav>
        )}

        {/* Main content */}
        <main id="main-content" style={{ flex: 1, overflow: 'auto', padding: 24, position: 'relative' }}>
          {renderScreen()}

          {/* Floating AI button */}
          {aiMode === 'floating' && activeModule !== 'ai' && (
            <div role="complementary" aria-label="AI Assistant" style={{ position: 'fixed', bottom: 24, right: showTweaks ? 280 : 24, zIndex: 100 }}>
              {showAIChat && (
                <div className="wbox" style={{ width: 300, height: 360, marginBottom: 10, display: 'flex', flexDirection: 'column', boxShadow: '0 8px 32px rgba(0,0,0,0.14)' }}>
                  <div style={{ padding: '12px 14px', borderBottom: '1px solid #e8e2da', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <div className="sketch" style={{ fontSize: 16, fontWeight: 700 }} id="floating-ai-chat"><span aria-hidden="true">✨</span> AI Assistant</div>
                    <button onClick={() => setShowAIChat(false)} aria-label="Close AI Assistant" style={{ border: 'none', background: 'none', cursor: 'pointer', fontSize: 20, color: '#5a5048', minHeight: 44, minWidth: 44, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>×</button>
                  </div>
                  <div style={{ flex: 1, padding: 12, overflowY: 'auto', fontSize: 12, color: '#5a5048', lineHeight: 1.6 }}>
                    <div style={{ background: '#f0ebe3', borderRadius: '12px 12px 12px 2px', padding: '8px 12px', marginBottom: 8 }}>
                      Hi Sarah! I can see you're looking at Dorothy's {MODULES.find(m => m.id === activeModule)?.label}. What would you like to know?
                    </div>
                  </div>
                  <div style={{ padding: 10, borderTop: '1px solid #e8e2da', display: 'flex', gap: 6 }}>
                    <div className="wbox" style={{ flex: 1, padding: '6px 10px', color: '#9a8f87', fontSize: 12 }}>Ask anything...</div>
                    <button className="btn btn-primary" style={{ fontSize: 12, padding: '6px 10px' }}>↑</button>
                  </div>
                </div>
              )}
              <button onClick={() => setShowAIChat(!showAIChat)} className="btn btn-primary" aria-expanded={showAIChat} aria-controls="floating-ai-chat" style={{ borderRadius: 24, fontSize: 14, padding: '10px 18px', boxShadow: '0 4px 16px rgba(74,112,80,0.4)' }}>
                <span aria-hidden="true">✨</span> Ask AI
              </button>
            </div>
          )}

          {/* Inline AI panel (right side) */}
          {aiMode === 'inline' && activeModule !== 'ai' && (
            <div style={{ position: 'fixed', top: 56, right: 0, bottom: 0, width: 280, background: '#fff', borderLeft: '1px solid #e8e2da', padding: 14, overflowY: 'auto', zIndex: 50 }}>
              <div className="sketch" style={{ fontSize: 16, fontWeight: 700, marginBottom: 6 }}>✨ AI Assistant</div>
              <div style={{ fontSize: 11, color: '#9a8f87', marginBottom: 10 }}>Contextual to Dorothy's profile</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 8, fontSize: 12 }}>
                {[
                  "What does Mom's POA allow?",
                  "Is Sertraline safe at 78?",
                  "Prep for cardiology visit",
                ].map((q, i) => (
                  <div key={i} className="wbox" style={{ padding: '7px 10px', cursor: 'pointer', color: '#4a7050' }}>{q}</div>
                ))}
              </div>
              <Divider />
              <div style={{ background: '#f0ebe3', borderRadius: 8, padding: 10, fontSize: 12, color: '#3a5038', lineHeight: 1.5 }}>
                💡 <strong>Proactive:</strong> Dorothy's LTC insurance expires in 73 days. Want help filing a renewal claim?
              </div>
              <div style={{ marginTop: 10 }}>
                <div className="wbox" style={{ padding: '8px 10px', color: '#9a8f87', fontSize: 12, marginBottom: 6 }}>Ask anything...</div>
                <button className="btn btn-primary" style={{ width: '100%', fontSize: 12 }}>Send</button>
              </div>
            </div>
          )}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
